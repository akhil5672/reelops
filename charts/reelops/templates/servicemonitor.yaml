{{- if .Values.serviceMonitor.enabled }}
{{- range $name, $svc := .Values.services }}
{{- $ctx := dict "name" $name "root" $ }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels:
    {{- include "reelops.labels" $ctx | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "reelops.selector" $ctx | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ $.Values.serviceMonitor.interval }}
{{- end }}
{{- end }}
