{{- range $name, $svc := .Values.services }}
---
# Name must match the EKS Pod Identity association created by Terraform (platform/identities.tf)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "reelops.labels" (dict "name" $name "root" $) | nindent 4 }}
{{- end }}
