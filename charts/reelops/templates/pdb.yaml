{{- range $name, $svc := .Values.services }}
{{- if and $svc.pdb $svc.pdb.enabled }}
{{- $ctx := dict "name" $name "root" $ }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "reelops.labels" $ctx | nindent 4 }}
spec:
  minAvailable: {{ $svc.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "reelops.selector" $ctx | nindent 6 }}
{{- end }}
{{- end }}
