{{- range $name, $svc := .Values.services }}
{{- $ctx := dict "name" $name "root" $ }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "reelops.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "reelops.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
{{- end }}
