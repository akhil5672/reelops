{{- if .Values.appConfig.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: reelops-config
spec:
  refreshInterval: {{ .Values.appConfig.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.appConfig.secretStore }}
  target:
    name: reelops-config
  dataFrom:
    - extract:
        key: reelops/{{ .Values.env }}/app-config
{{- end }}
