{{- if .Values.ingress.enabled }}
{{- $svcName := .Values.ingress.service }}
{{- $svc := index .Values.services $svcName }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reelops
  labels:
    {{- include "reelops.labels" (dict "name" $svcName "root" $) | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    alb.ingress.kubernetes.io/tags: project=reelops,env={{ .Values.env }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $svcName }}
                port: { number: {{ $svc.port }} }
{{- end }}
